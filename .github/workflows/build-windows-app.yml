name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches: [testes]
    paths:
      - "desktop/**"
      - "public/**"
      - "server.js"
      - "package.json"
      - ".github/workflows/build-windows-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer (disable GitHub Release publishing)
        run: npm run dist -- --publish never

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "Nenhum instalador .exe foi encontrado em dist."
          }
          if ($installer.Length -lt 1MB) {
            throw "O instalador .exe parece incompleto (menor que 1 MB)."
          }
          Write-Host "Instalador validado: $($installer.FullName)"
          Write-Host "Tamanho: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VDO-Simples-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
