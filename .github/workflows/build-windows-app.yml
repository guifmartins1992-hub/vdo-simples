name: Build Windows Desktop App
on:
  workflow_dispatch:
  push:
    branches: [testes]
    paths:
      - "desktop/**"
      - "public/**"
      - "server.js"
      - "package.json"
      - ".github/workflows/build-windows-app.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: VDO-Simples-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
